# -O1 (not -O2): Cemu 2.6's PPC recompiler mis-executes GCC 16 -O2 code in BN_usub (CR0 saved via mfcr
# across calls) -> wild write / host access violation. See BUILD-NOTES.md.
my %targets = (
    "wiiu" => {
        inherit_from => [ "BASE_unix" ],
        CC => "powerpc-eabi-gcc",
        CXX => "powerpc-eabi-g++",
        CFLAGS => "-O1 -ffunction-sections -fdata-sections -mcpu=750 -meabi -mhard-float -DESPRESSO -D__WIIU__ -D__WUT__ -DB_ENDIAN -DNO_SYSLOG -Dtimezone=_timezone -D_GNU_SOURCE -DOPENSSL_NO_SECURE_MEMORY -I$DEVKITPRO/wut/include -I$DEVKITPRO/portlibs/wiiu/include -I$DEVKITPRO/portlibs/ppc/include",
        cflags => "",
        
        AR => "powerpc-eabi-ar",
        ARFLAGS => "r",
        RANLIB => "powerpc-eabi-ranlib",
        bn_ops => "BN_LLONG RC4_CHAR",
        thread_scheme => "(unknown)",
        perlasm_scheme => "void",
        shared_target => "",
        lib_cppflags => "",
        dso_scheme => "",
    },
);
